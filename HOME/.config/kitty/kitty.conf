# # Dinamic Config
# geninclude config.py

# vim: foldmethod=marker 

# {{{ Other
font_size 12.0

pixel_scroll yes
cursor_trail 3
cursor_trail_decay 0.1 0.4

scrollback_lines 10000

underline_hyperlinks hover

# copy_on_select yes

visual_bell_duration 0.0
dynamic_background_opacity yes

# Window padding
window_padding_width 4

# No tittle bar
hide_window_decorations yes

tab_bar_style fade
tab_bar_align center

allow_remote_control socket-only
listen_on unix:/tmp/mykitty
# }}}

# [Navigate the Kitty Scrollback with Neovim - YouTube](https://www.youtube.com/watch?v=2IU5qd-ahgw)
map alt+: launch --stdin-source=@screen_scrollback --type=overlay /usr/bin/env bash -c "SCROLL_MODE=2 nvim"

# {{{ Sessions
tab_bar_filter session:~ or session:^$ 
# Unfortunatly still needed since we use remote control to start the session 
# allow_remote_control yes 
map alt+shift+w save_as_session --relocatable --use-foreground-process --match=session:. .
map alt+shift+o launch  --type=tab ~/.config/kitty/kitty-sessionizer.lua
# Save the status of the current session to its file
map alt+shift+a goto_session -1
# Go to the previously opened session
map alt+shift+u  launch  --type=tab ~/.config/kitty/session-switch.sh
# See a overview of open sessions and choose one
map alt+shift+q close_session 
# }}}

# Clipboard
map --when-focus-on var:in_editor ctrl+shift+c
map --when-focus-on var:in_editor ctrl+shift+v
map --when-focus-on var:in_editor ctrl+shift+x

# Sytem Windows
map kitty_mod+n launch --type=os-window --cwd=current 
# Windows
# Move Window to another kitty 
map alt+shift+w detach_window ask
map alt+shift+t detach_tab ask
map kitty_mod+enter launch --type=window --cwd=current 

#  Tab 
map kitty_mod+t launch --type=tab --cwd=current 


include current-theme.conf

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMonoNL Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
